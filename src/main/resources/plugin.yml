name: Safe
version: '${version}'

main: net.sealing99.safe.Safe
api-version: '1.21'
load: STARTUP

authors: [ Sealing99 ]

commands:
  bal:
    usage: /bal
    description: Shows the player their balance
  safe:
    usage: /safe <subcommand> [args]
    description: Main Safe command
  pay:
    usage: /pay <playername> <amount>
    description: Give a player your money

permissions:
  safe.admin:
    default: op
